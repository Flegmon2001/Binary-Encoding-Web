<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Binary Galaxy</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">
    <div href="https://flegmon2001.github.io/MainFleg-Web/" class="nav-left">Fleg-Web</div>
</nav>

<div class="main">
    <div class="card">

        <h2 id="modeLabel">Text → Binary</h2>

        <!-- INFO BOX -->
        <div id="infoBox">
            Letters: ":" | Symbols: ";" | Numbers: "(" | Words: "/"
        </div>

        <!-- INPUT -->
        <textarea id="inputText" placeholder="Enter text..."></textarea>

        <!-- BUTTONS -->
        <div class="buttons">
            <button onclick="convertText()">Convert</button>
            <button class="switch" onclick="switchMode()">⇄</button>
        </div>

        <!-- OUTPUT -->
        <textarea id="outputText" placeholder="Binary output..." readonly></textarea>

    </div>
</div>

<script src="script.js"></script>
</body>
</html>
