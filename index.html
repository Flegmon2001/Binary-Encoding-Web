<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Binary Galaxy</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">
    <div class="nav-left">🌌 BinaryGalaxy</div>
</nav>

<div class="main">
    <div class="card">
        <h1 id="title">Text → Binary</h1>

        <div id="inputContainer">
            <textarea id="inputText" placeholder="Enter text..."></textarea>
        </div>

        <div class="buttons">
            <button onclick="convertText()">Convert</button>
            <button class="switch" onclick="switchMode()">⇄ Switch</button>
        </div>

        <div id="outputContainer">
            <textarea id="outputText" placeholder="Binary output..." readonly></textarea>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
