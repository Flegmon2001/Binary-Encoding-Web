<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Binary Galaxy</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar">
    <div class="nav-left" href="https://flegmon2001.github.io/MainFleg-Web/>MainFleg-Web</div>
</nav>

<div class="main">
    <div class="card">
        <h2 id="modeLabel">Text → Binary</h2>

        <!-- INPUT FIELD -->
        <div id="inputContainer">
            <textarea id="inputText" placeholder="Enter text..."></textarea>
        </div>

        <div class="buttons">
            <button onclick="convertText()">Convert</button>
            <button class="switch" onclick="switchMode()">⇄ Switch</button>
        </div>

        <!-- OUTPUT FIELD -->
        <div id="outputContainer">
            <textarea id="outputText" placeholder="Binary output..." readonly></textarea>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
